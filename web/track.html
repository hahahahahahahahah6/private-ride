<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>行程分享 · 私人专车</title>
<link rel="stylesheet" href="styles.css?v=20261006c" />
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <span class="mark">🔗</span>
      <h1>行程分享<em>SHARED RIDE</em></h1>
    </div>
  </div>
  <div id="content"><div class="card"><p class="hint">加载中…</p></div></div>
  <p class="hint" style="text-align:center">此链接由乘客分享，仅显示行程状态和司机位置，不含乘客隐私信息。</p>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const STATUS_LABEL = {
    requested: "待接单", accepted: "已接单", en_route: "司机正在赶来",
    arrived: "司机已到达", in_progress: "行程中", completed: "已完成", cancelled: "已取消",
  };
  const token = new URLSearchParams(location.search).get("t");

  async function load() {
    const box = $("content");
    if (!token) {
      box.innerHTML = '<div class="card"><p class="hint">链接无效：缺少分享 token。</p></div>';
      return;
    }
    try {
      const r = await (await fetch(`/share/${encodeURIComponent(token)}`)).json();
      if (r.detail) throw new Error(r.detail);
      const when = r.scheduled_at
        ? new Date(r.scheduled_at).toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })
        : "现在用车";
      const stops = (r.stops && r.stops.length)
        ? `<div class="meta">📍 经停：${r.stops.map(esc).join(" → ")}</div>` : "";
      let locHtml = "";
      if (r.driver_lat != null && r.driver_lng != null) {
        const mins = Math.round((Date.now() - new Date(r.location_updated_at).getTime()) / 60000);
        const mapsUrl = `https://www.google.com/maps/dir/?api=1&origin=${r.driver_lat},${r.driver_lng}&destination=${encodeURIComponent(r.pickup_text)}`;
        locHtml = `<div class="meta">📍 司机位置（${mins <= 0 ? "刚刚" : mins + " 分钟前"}更新）· <a href="${mapsUrl}" target="_blank">在地图上看</a></div>`;
      }
      box.innerHTML = `<div class="card">
        <div class="card-head"><span>${esc(STATUS_LABEL[r.status] || r.status)}</span>
        <span class="time">${when}</span></div>
        <div class="route"><span class="pdot from"></span><span>${esc(r.pickup_text)}</span></div>
        <div class="route"><span class="pdot to"></span><span>${esc(r.dropoff_text)}</span></div>
        ${stops}
        ${(r.vehicle_model || r.plate) ? `<div class="meta">🚙 ${esc(r.vehicle_model)}${r.plate ? " · " + esc(r.plate) : ""}</div>` : ""}
        ${locHtml}
      </div>`;
    } catch (e) {
      box.innerHTML = `<div class="card"><p class="hint">${esc(e.message || "加载失败")}</p></div>`;
    }
  }

  load();
  setInterval(load, 20000);
</script>
</body>
</html>
