<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title data-i18n="meta.title.passenger">乘客 · 私人专车</title>
<link rel="stylesheet" href="styles.css?v=20261014a" />
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <span class="mark">🧍</span>
      <h1><span data-i18n="p.title">乘客约车</span><em>PASSENGER</em></h1>
    </div>
    <span class="links"><button type="button" class="lang-toggle" id="lang-toggle">EN</button><a href="account.html" data-i18n="nav.account">账号</a><a href="index.html" data-i18n="nav.switch">切换身份</a><a href="#" onclick="logout();return false;" data-i18n="nav.signout">退出</a></span>
  </div>

  <div id="login"></div>

  <div id="main" style="display:none">
    <div class="card">
      <div class="card_h" data-i18n="p.book">叫车</div>
      <p class="hint" id="driver-status-line" data-i18n="p.driver_checking">正在查看司机状态…</p>
      <label class="f" for="pickup" data-i18n="p.pickup">上车地点</label>
      <input id="pickup" data-i18n-ph="p.pickup_ph" placeholder="例如：家里小区门口" />
      <label class="f" for="dropoff" data-i18n="p.dropoff">下车地点</label>
      <input id="dropoff" data-i18n-ph="p.dropoff_ph" placeholder="例如：罗兰岗大华超市" />
      <div id="stops-wrap"></div>
      <button type="button" class="secondary small" id="btn-add-stop" style="margin-bottom:10px" data-i18n="p.add_stop">＋ 经停点（最多 3 个）</button>
      <div class="row">
        <div style="flex:1">
          <label class="f" for="seats" data-i18n="p.seats">人数</label>
          <input id="seats" type="number" min="1" max="20" value="1" />
        </div>
        <div style="flex:2">
          <label class="f" for="when" data-i18n="p.when">用车时间</label>
          <input id="when" type="datetime-local" />
        </div>
      </div>
      <label class="f" for="note" data-i18n="p.note">备注（可选）</label>
      <input id="note" data-i18n-ph="p.note_ph" placeholder="如：有大件行李、带小孩" />
      <details style="margin-bottom:10px">
        <summary class="hint" style="cursor:pointer" data-i18n="p.book_other">🧑‍🤝‍🧑 帮别人叫车（可选）</summary>
        <label class="f" for="bf-name" data-i18n="p.rider_name">乘车人姓名</label>
        <input id="bf-name" data-i18n-ph="p.rider_name_ph" placeholder="如：妈妈" maxlength="64" />
        <label class="f" for="bf-phone" data-i18n="p.rider_phone">乘车人电话</label>
        <input id="bf-phone" data-i18n-ph="p.rider_phone_ph" placeholder="司机联系乘车人用" maxlength="32" />
      </details>
      <label class="f" data-i18n="p.pricing">价格方式</label>
      <div class="row" style="gap:8px;margin-bottom:10px">
        <button type="button" class="secondary small price-mode" data-mode="offer" style="flex:1" data-i18n="p.mode_offer">我出价</button>
        <button type="button" class="secondary small price-mode" data-mode="mileage" style="flex:1" data-i18n="p.mode_mileage">里程计价</button>
        <button type="button" class="secondary small price-mode" data-mode="quote" style="flex:1" data-i18n="p.mode_quote">司机报价</button>
      </div>
      <div id="price-offer-wrap">
        <label class="f" for="price-offer" data-i18n="p.offer_label">你的出价（美元）</label>
        <input id="price-offer" type="number" min="0" step="0.5" data-i18n-ph="p.offer_ph" placeholder="如：25" />
      </div>
      <div id="price-mileage-wrap" style="display:none">
        <label class="f" for="price-miles" data-i18n="p.miles_label">预估里程（英里）</label>
        <input id="price-miles" type="number" min="0" step="0.5" data-i18n-ph="p.miles_ph" placeholder="如：10" />
        <p class="hint" id="mileage-hint" data-i18n="p.mileage_base">起步 $8 + $3/英里</p>
      </div>
      <div id="price-quote-wrap" style="display:none">
        <p class="hint" data-i18n="p.quote_hint">司机接单后会报价，你再确认。</p>
      </div>
      <label class="f" data-i18n="p.payment">付款方式</label>
      <div class="row" style="gap:8px;margin-bottom:10px">
        <button type="button" class="secondary small pay-mode" data-mode="offline" style="flex:1" data-i18n="p.pay_offline">线下当面付</button>
        <button type="button" class="secondary small pay-mode" data-mode="online" style="flex:1" data-i18n="p.pay_online">线上付款</button>
      </div>
      <div id="card-wrap" style="display:none">
        <div id="card-info" class="hint"></div>
        <div id="card-form" style="display:none">
          <div id="card-element" style="padding:12px;background:var(--card);border-radius:12px;margin-bottom:8px"></div>
          <button type="button" class="secondary small" id="btn-bind-card" data-i18n="p.bind_card">绑定这张卡</button>
          <p class="hint" id="bind-msg"></p>
        </div>
      </div>
      <button class="primary pulse" id="btn-book" data-i18n="p.book_now">叫车</button>
      <p class="hint" id="book-msg"></p>
    </div>

    <div class="card">
      <div class="card_h" data-i18n="p.places">常用地址</div>
      <div id="places"></div>
      <div class="row" style="margin-top:8px">
        <input id="place-label" data-i18n-ph="p.place_label_ph" placeholder="名称，如：家" style="flex:1" maxlength="32" />
        <input id="place-addr" data-i18n-ph="p.place_addr_ph" placeholder="地址" style="flex:2" maxlength="500" />
        <button class="small primary" id="btn-add-place" data-i18n="p.save">保存</button>
      </div>
      <p class="hint" id="place-msg"></p>
    </div>

    <div class="sec"><h3 data-i18n="p.my_rides">我的订单</h3><span class="count" id="rides-count"></span></div>
    <div id="rides"></div>
  </div>
</div>
<script src="i18n.js?v=20261014a"></script>
<script src="app.js?v=20261014a"></script>
<script src="https://js.stripe.com/v3/"></script>
<script>
  const $ = (id) => document.getElementById(id);

  // ---- 司机在线状态 ----
  async function loadDriverStatus() {
    const el = $("driver-status-line");
    try {
      const ds = await api.req("/drivers/status");
      if (!ds.length) { el.textContent = t("p.no_driver"); return; }
      el.innerHTML = ds.map((d) =>
        `${d.is_active ? "🟢" : "🔴"} ${esc(d.name)}${d.vehicle_model ? `（${esc(d.vehicle_model)}）` : ""} ${d.is_active ? t("p.online") : t("p.offline")}`
      ).join("<br />");
    } catch (e) { el.textContent = ""; }
  }

  // ---- 经停点 ----
  function addStopInput(value = "") {
    const wrap = $("stops-wrap");
    const n = wrap.querySelectorAll("input").length;
    if (n >= 3) return;
    const inp = document.createElement("input");
    inp.placeholder = t("p.stop_ph", { n: n + 1 });
    inp.maxLength = 500;
    inp.value = value;
    inp.style.marginBottom = "10px";
    wrap.appendChild(inp);
    if (wrap.querySelectorAll("input").length >= 3) $("btn-add-stop").style.display = "none";
  }
  $("btn-add-stop").onclick = () => addStopInput();
  function getStops() {
    return [...$("stops-wrap").querySelectorAll("input")]
      .map((i) => i.value.trim()).filter(Boolean).slice(0, 3);
  }

  // ---- 付款方式 ----
  let payMode = "offline";
  let stripe = null, cardEl = null, stripePk = "";
  document.querySelectorAll(".pay-mode").forEach((b) => {
    b.onclick = async () => {
      payMode = b.dataset.mode;
      document.querySelectorAll(".pay-mode").forEach((x) =>
        x.classList.toggle("primary", x === b));
      $("card-wrap").style.display = payMode === "online" ? "" : "none";
      if (payMode === "online") await initCard();
    };
  });
  document.querySelector('.pay-mode[data-mode="offline"]').classList.add("primary");

  async function initCard() {
    try {
      const cfg = await api.req("/pay/config");
      stripePk = cfg.publishable_key;
      if (!cfg.configured || !stripePk) {
        $("card-info").textContent = t("p.card_na");
        return;
      }
      const me = await api.me();
      if (me.card_last4) {
        $("card-info").textContent = t("p.card_onfile", { b: me.card_brand || "", l: me.card_last4 });
        $("card-form").style.display = "none";
      } else {
        $("card-info").textContent = t("p.card_none");
        $("card-form").style.display = "";
        if (!stripe) {
          stripe = Stripe(stripePk);
          const elements = stripe.elements();
          cardEl = elements.create("card", { style: { base: { color: "#fff", fontSize: "16px" } } });
          cardEl.mount("#card-element");
        }
      }
    } catch (e) { $("card-info").textContent = e.message; }
  }

  $("btn-bind-card").onclick = async () => {
    const msg = $("bind-msg");
    msg.textContent = t("p.binding");
    try {
      const { client_secret } = await api.req("/pay/setup-intent", { method: "POST" });
      const { setupIntent, error } = await stripe.confirmCardSetup(client_secret, {
        payment_method: { card: cardEl },
      });
      if (error) throw new Error(error.message);
      const r = await api.req("/pay/attach", {
        method: "POST",
        body: JSON.stringify({ payment_method_id: setupIntent.payment_method }),
      });
      msg.textContent = t("p.bound", { b: r.brand, l: r.last4 });
      $("card-form").style.display = "none";
      $("card-info").textContent = t("p.card_onfile", { b: r.brand, l: r.last4 });
    } catch (e) { msg.textContent = e.message; }
  };

  // 价格方式切换
  let priceMode = "offer";
  document.querySelectorAll(".price-mode").forEach((b) => {
    b.onclick = () => {
      priceMode = b.dataset.mode;
      document.querySelectorAll(".price-mode").forEach((x) =>
        x.classList.toggle("primary", x === b));
      $("price-offer-wrap").style.display = priceMode === "offer" ? "" : "none";
      $("price-mileage-wrap").style.display = priceMode === "mileage" ? "" : "none";
      $("price-quote-wrap").style.display = priceMode === "quote" ? "" : "none";
    };
  });
  document.querySelector('.price-mode[data-mode="offer"]').classList.add("primary");
  function updateMileageHint() {
    const m = parseFloat($("price-miles").value);
    $("mileage-hint").textContent = m > 0
      ? t("p.mileage_est", { e: "$" + (8 + 3 * m).toFixed(2) })
      : t("p.mileage_base");
  }
  $("price-miles").oninput = updateMileageHint;

  async function confirmQuoteUI(id, cents) {
    if (!confirm(t("p.quote_accept_q", { p: "$" + (cents / 100).toFixed(2) }))) return;
    try { await api.confirmQuote(id, true); refresh(); }
    catch (e) { alert(e.message); }
  }
  async function rejectQuoteUI(id) {
    if (!confirm(t("p.decline_q"))) return;
    try { await api.confirmQuote(id, false); refresh(); }
    catch (e) { alert(e.message); }
  }

  function rideCard2(r, actionsHtml = "") {
    const when = r.scheduled_at
      ? new Date(r.scheduled_at).toLocaleString(dateLocale(), { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })
      : t("card.now");
    let quoteHtml = "";
    if (r.price_mode === "quote" && r.price_status === "pending" && r.price_quote_cents != null) {
      quoteHtml = `<div class="actions">
        <button class="small primary" onclick="confirmQuoteUI('${r.id}', ${r.price_quote_cents})">${t("p.accept", { p: "$" + (r.price_quote_cents / 100).toFixed(2) })}</button>
        <button class="small secondary" onclick="rejectQuoteUI('${r.id}')">${t("p.decline")}</button>
      </div>`;
    }
    // 小费：已完成未给过显示快捷按钮
    let tipHtml = "";
    if (r.status === "completed") {
      tipHtml = r.tip_cents != null
        ? `<div class="meta">${t("p.tipped", { p: "$" + (r.tip_cents / 100).toFixed(2) })}</div>`
        : `<div class="meta" id="tipwrap-${r.id}">${t("p.tip")}
            ${[3, 5, 10].map((d) => `<button class="small secondary" style="padding:2px 8px" onclick="tipRide('${r.id}',${d * 100})">$${d}</button>`).join(" ")}
            <button class="small secondary" style="padding:2px 8px" onclick="tipCustom('${r.id}')">${t("p.tip_other")}</button>
          </div>`;
    }
    // 分享：进行中订单可生成分享链接；催司机：accepted/en_route 可催
    const shareHtml = ["accepted", "en_route", "arrived", "in_progress"].includes(r.status)
      ? `<div class="actions"><button class="small secondary" onclick="shareRide('${r.id}')">${t("p.share")}</button></div>` : "";
    const nudgeHtml = ["accepted", "en_route"].includes(r.status)
      ? `<div class="actions"><button class="small secondary" onclick="nudgeRide('${r.id}')">${t("p.nudge")}</button></div>` : "";
    // 收据：已完成订单的费用明细
    const receiptHtml = r.status === "completed"
      ? `<div class="actions"><button class="small secondary" onclick="toggleReceipt('${r.id}')">${t("p.receipt")}</button></div>
         <div class="meta" id="receipt-${r.id}" style="display:none;border:1px dashed var(--faint);border-radius:8px;padding:8px;margin-top:6px">
           <b>${t("p.receipt_title")}</b><br />${when}<br />${esc(r.pickup_text)} → ${esc(r.dropoff_text)}<br />
           ${t("p.fare")} $${((r.price_final_cents || 0) / 100).toFixed(2)}${r.tip_cents ? `<br />${t("p.tip_line")} $${(r.tip_cents / 100).toFixed(2)}` : ""}<br />
           <b>${t("p.total")} $${(((r.price_final_cents || 0) + (r.tip_cents || 0)) / 100).toFixed(2)}</b>
         </div>` : "";
    const stopsHtml = (r.stops && r.stops.length)
      ? `<div class="meta">${t("p.stops")}${r.stops.map(esc).join(" → ")}</div>` : "";
    const tagSep = prLang() === "en" ? ", " : "、";
    return `<div class="card">
      <div class="card-head"><span class="${badgeClass(r.status)}">${statusLabel(r.status)}</span>
      <span class="time">${when}</span></div>
      <div class="route"><span class="route-line"></span><span class="pdot from"></span><span>${esc(r.pickup_text)}</span></div>
      <div class="route"><span class="pdot to"></span><span>${esc(r.dropoff_text)}</span></div>
      ${stopsHtml}
      <div class="meta"><b>${riders(r.seats_needed)}</b>${r.note ? " · " + esc(r.note) : ""}</div>
      ${r.booked_for_name ? `<div class="meta">${t("p.booked_for")}${esc(r.booked_for_name)}${r.booked_for_phone ? " · " + esc(r.booked_for_phone) : ""}</div>` : ""}
      <div class="meta">💰 ${esc(priceLabel(r))}</div>
      <div class="meta">💳 ${esc(payLabel(r))}</div>
      ${r.driver_vehicle && (r.driver_vehicle.vehicle_model || r.driver_vehicle.plate)
        ? `<div class="meta">${t("p.vehicle")}${esc(r.driver_vehicle.vehicle_model)}${r.driver_vehicle.plate ? " · " + esc(r.driver_vehicle.plate) : ""}${r.driver_vehicle.rating_count > 0 ? " · " + t("p.ratings", { a: r.driver_vehicle.avg_rating, c: r.driver_vehicle.rating_count }) : ""}</div>` : ""}
      ${["accepted", "en_route", "arrived", "in_progress"].includes(r.status) && r.driver_phone
        ? `<div class="meta">${t("p.driver_phone")}<a href="tel:${esc(r.driver_phone)}">${esc(r.driver_phone)}</a></div>` : ""}
      ${["accepted", "en_route", "arrived", "in_progress"].includes(r.status) && r.driver_id
        ? `<div class="meta" id="drvloc-${r.id}">${t("p.driver_loc_loading")}</div>` : ""}
      ${r.status === "completed" ? (r.rating_stars
        ? `<div class="meta">${t("p.rated", { s: r.rating_stars })}${(r.rating_tags || []).length ? " · " + r.rating_tags.map(esc).join(tagSep) : ""}${r.rating_comment ? " · " + esc(r.rating_comment) : ""}</div>`
        : `<div class="meta" id="ratewrap-${r.id}">${t("p.rate_driver")}
            <span id="ratestars-${r.id}">${[1, 2, 3, 4, 5].map((s) => `<button class="small secondary" style="padding:2px 8px" onclick="pickStar('${r.id}',${s})">⭐${s}</button>`).join(" ")}</span>
            <span id="ratetags-${r.id}" style="display:none"><br />${t("p.rate_tags")}
              ${ratingTagOpts().map((tg) => `<button class="small secondary" style="padding:2px 8px;margin:2px" data-tag="${tg}" onclick="toggleTag('${r.id}','${tg}');return false;">${tg}</button>`).join(" ")}
              <button class="small primary" style="padding:2px 8px;margin:2px" onclick="submitRate('${r.id}')">${t("p.submit")}</button>
            </span>
          </div>`) : ""}
      ${tipHtml}
      ${receiptHtml}
      ${shareHtml}
      ${nudgeHtml}
      ${actionsHtml}
      ${quoteHtml}
    </div>`;
  }

  async function tipRide(id, cents) {
    if (!confirm(t("p.tip_q", { p: "$" + (cents / 100).toFixed(2) }))) return;
    try { await api.req(`/rides/${id}/tip`, { method: "POST", body: JSON.stringify({ tip_cents: cents }) }); refresh(); }
    catch (e) { alert(e.message); }
  }
  async function tipCustom(id) {
    const v = prompt(t("p.tip_prompt"));
    if (v == null) return;
    const cents = Math.round(parseFloat(v) * 100);
    if (!(cents >= 100)) { alert(t("p.tip_min")); return; }
    tipRide(id, cents);
  }
  async function shareRide(id) {
    try {
      const r = await api.req(`/rides/${id}/share`, { method: "POST" });
      const url = location.origin + r.url;
      if (navigator.clipboard) await navigator.clipboard.writeText(url);
      alert(t("p.share_copied", { url }));
    } catch (e) { alert(e.message); }
  }

  async function refreshDriverLoc(id, pickupText) {
    const el = $("drvloc-" + id);
    if (!el) return;
    try {
      const loc = await api.req(`/rides/${id}/driver-location`);
      if (!loc) { el.textContent = t("p.driver_loc_none"); return; }
      const mins = Math.round((Date.now() - new Date(loc.updated_at).getTime()) / 60000);
      const when = mins <= 0 ? t("p.just_now") : t("p.min_ago", { m: mins });
      const mapsUrl = `https://www.google.com/maps/dir/?api=1&origin=${loc.lat},${loc.lng}&destination=${encodeURIComponent(pickupText)}`;
      el.innerHTML = t("p.driver_loc", { w: when, u: mapsUrl });
    } catch (e) { el.textContent = ""; }
  }

  // ---- 常用地址 ----
  async function loadPlaces() {
    const wrap = $("places");
    try {
      const ps = await api.req("/me/places");
      wrap.innerHTML = ps.length
        ? ps.map((p) => `<div class="row" style="align-items:center;margin-bottom:6px">
            <span style="flex:1">📍 <b>${esc(p.label)}</b> · ${esc(p.address_text)}</span>
            <button class="small secondary" onclick="usePlace('pickup','${p.id}')">${t("p.set_pickup")}</button>
            <button class="small secondary" onclick="usePlace('dropoff','${p.id}')">${t("p.set_dropoff")}</button>
            <button class="small danger" onclick="delPlace('${p.id}')">${t("p.del")}</button>
          </div>`).join("")
        : `<p class="hint">${t("p.places_empty")}</p>`;
      wrap._data = ps;
    } catch (e) { wrap.innerHTML = `<p class="hint">${esc(e.message)}</p>`; }
  }
  function usePlace(field, id) {
    const p = ($("places")._data || []).find((x) => x.id === id);
    if (p) $(field === "pickup" ? "pickup" : "dropoff").value = p.address_text;
  }
  async function delPlace(id) {
    if (!confirm(t("p.del_place"))) return;
    try { await api.req(`/me/places/${id}`, { method: "DELETE" }); loadPlaces(); }
    catch (e) { alert(e.message); }
  }
  $("btn-add-place").onclick = async () => {
    const msg = $("place-msg");
    const label = $("place-label").value.trim();
    const address_text = $("place-addr").value.trim();
    if (!label || !address_text) { msg.textContent = t("p.need_place_fields"); return; }
    try {
      await api.req("/me/places", { method: "POST", body: JSON.stringify({ label, address_text }) });
      $("place-label").value = $("place-addr").value = "";
      msg.textContent = "";
      loadPlaces();
    } catch (e) { msg.textContent = e.message; }
  };

  async function refresh() {
    try {
      const rides = await api.myRides();
      $("rides-count").textContent = rides.length ? t("p.rides_count", { n: rides.length }) : "";
      $("rides").innerHTML = rides.length
        ? rides.map((r) => {
            const canCancel = ["requested", "accepted", "en_route", "arrived"].includes(r.status);
            const actions = canCancel
              ? `<div class="actions"><button class="small danger" onclick="cancelRide('${r.id}')">${t("p.cancel_ride")}</button></div>` : "";
            return rideCard2(r, actions);
          }).join("")
        : `<div class="empty"><span class="big">🚗</span>${t("p.no_rides")}<br />${t("p.no_rides_sub")}</div>`;
      rides.forEach((r) => {
        if (["accepted", "en_route", "arrived", "in_progress"].includes(r.status) && r.driver_id) {
          refreshDriverLoc(r.id, r.pickup_text);
        }
      });
    } catch (e) { $("rides").innerHTML = `<p class="hint">${esc(e.message)}</p>`; }
  }

  async function cancelRide(id) {
    if (!confirm(t("p.confirm_cancel"))) return;
    try { await api.cancelRide(id); refresh(); }
    catch (e) { alert(e.message); }
  }

  // ---- 评分（星级 + 标签） ----
  function ratingTagOpts() {
    return prLang() === "en"
      ? ["Smooth driver", "On time", "Clean car", "Knows routes", "Great service"]
      : ["开车稳", "很准时", "车干净", "路线熟", "服务好"];
  }
  const _rateSel = {};
  function pickStar(id, s) {
    _rateSel[id] = { stars: s, tags: [] };
    document.querySelectorAll(`#ratestars-${id} button`).forEach((b, i) =>
      b.classList.toggle("primary", i < s));
    $(`ratetags-${id}`).style.display = "";
  }
  function toggleTag(id, t) {
    const st = _rateSel[id];
    if (!st) return;
    const i = st.tags.indexOf(t);
    if (i >= 0) st.tags.splice(i, 1);
    else if (st.tags.length < 3) st.tags.push(t);
    else return;
    document.querySelectorAll(`#ratetags-${id} button[data-tag]`).forEach((b) =>
      b.classList.toggle("primary", st.tags.includes(b.dataset.tag)));
  }
  async function submitRate(id) {
    const st = _rateSel[id];
    if (!st) return;
    try {
      await api.req(`/rides/${id}/rate`, {
        method: "POST",
        body: JSON.stringify({ stars: st.stars, tags: st.tags }),
      });
      refresh();
    } catch (e) { alert(e.message); }
  }
  async function rateRide(id, stars) {
    try { await api.rateRide(id, stars); refresh(); }
    catch (e) { alert(e.message); }
  }

  async function nudgeRide(id) {
    try { await api.req(`/rides/${id}/nudge`, { method: "POST" }); alert(t("p.nudged")); }
    catch (e) { alert(e.message); }
  }
  function toggleReceipt(id) {
    const el = $(`receipt-${id}`);
    if (el) el.style.display = el.style.display === "none" ? "" : "none";
  }

  $("btn-book").onclick = async () => {
    const msg = $("book-msg");
    const pickup_text = $("pickup").value.trim();
    const dropoff_text = $("dropoff").value.trim();
    if (!pickup_text || !dropoff_text) { msg.classList.remove("ok"); msg.textContent = t("p.need_places"); return; }
    const when = $("when").value;
    const data = {
      pickup_text, dropoff_text,
      seats_needed: parseInt($("seats").value) || 1,
      note: $("note").value.trim(),
      scheduled_at: when ? new Date(when).toISOString() : null,
      price_mode: priceMode,
      pay_mode: payMode,
      stops: getStops(),
      booked_for_name: $("bf-name").value.trim(),
      booked_for_phone: $("bf-phone").value.trim(),
    };
    if (priceMode === "offer") {
      const dollars = parseFloat($("price-offer").value);
      if (!(dollars > 0)) { msg.classList.remove("ok"); msg.textContent = t("p.need_offer"); return; }
      data.price_offer_cents = Math.round(dollars * 100);
    } else if (priceMode === "mileage") {
      const miles = parseFloat($("price-miles").value);
      if (!(miles > 0)) { msg.classList.remove("ok"); msg.textContent = t("p.need_miles"); return; }
      data.price_miles = miles;
    }
    try {
      await api.createRide(data);
      msg.classList.add("ok");
      msg.textContent = t("p.booked_ok");
      $("pickup").value = $("dropoff").value = $("note").value = "";
      $("bf-name").value = $("bf-phone").value = "";
      $("price-offer").value = ""; $("price-miles").value = "";
      refresh();
    } catch (e) { msg.classList.remove("ok"); msg.textContent = e.message; }
  };

  ensureSession($("login"), $("main"), () => { refresh(); loadPlaces(); loadDriverStatus(); });
  setInterval(() => { if ($("main").style.display !== "none") refresh(); }, 15000);
  // 语言切换时重渲染动态内容
  window.addEventListener("pr:langchange", () => {
    updateMileageHint();
    if ($("main").style.display !== "none") { refresh(); loadPlaces(); loadDriverStatus(); }
  });
</script>
</body>
</html>
