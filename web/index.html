<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title data-i18n="meta.title.index">私人专车</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#0e0e0e" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="私人专车" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("/web/sw.js").catch(() => {}));</script>
<link rel="stylesheet" href="styles.css?v=20261014a" />
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <span class="mark">🚗</span>
      <h1><span data-i18n="brand.name">私人专车</span><em>PRIVATE RIDE</em></h1>
    </div>
    <span class="links"><button type="button" class="lang-toggle" id="lang-toggle">EN</button></span>
  </div>

  <div class="hero">
    <div class="kicker" data-i18n="index.kicker">家人朋友 · 专属叫车</div>
    <h1><span data-i18n="index.hero1">一键叫车</span><br /><span class="gold" data-i18n="index.hero2">司机马上到</span></h1>
    <p data-i18n-html="index.hero_sub">TCP 持牌运营，家人朋友的私人车队。<br />网页与 App 共用同一后端。</p>
  </div>

  <a class="role-card" href="passenger.html">
    <span class="icon">🧍</span>
    <span>
      <div class="t" data-i18n="index.rider_t">我是乘客</div>
      <div class="s" data-i18n="index.rider_s">输入上下车地点，一键叫车，实时看订单状态</div>
    </span>
    <span class="go">›</span>
  </a>

  <a class="role-card" href="driver.html">
    <span class="icon">🚙</span>
    <span>
      <div class="t" data-i18n="index.driver_t">我是司机</div>
      <div class="s" data-i18n="index.driver_s">查看待接订单，一键接单，全程状态管理</div>
    </span>
    <span class="go">›</span>
  </a>

  <div class="install-card" id="install-card" hidden>
    <div class="t" data-i18n="install.t">装到手机桌面，像 App 一样用</div>
    <div class="s" id="install-tip"></div>
    <button type="button" class="primary small" id="install-btn" hidden data-i18n="install.btn">安装 App</button>
    <button type="button" class="install-x" id="install-x" aria-label="close">×</button>
  </div>

  <p class="center">V0.4</p>
</div>
<script src="i18n.js?v=20261014a"></script>
<script>
  // 安装提示：已经是 App 模式或用户点过关闭就不显示
  (function () {
    const card = document.getElementById("install-card");
    const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
    let dismissed = false;
    try { dismissed = localStorage.getItem("pr_install_x") === "1"; } catch (e) {}
    if (standalone || dismissed) return;
    const tr = (k, zh) => (typeof t === "function" ? t(k) : zh);
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    if (ios) {
      document.getElementById("install-tip").textContent = tr("install.ios", "用 Safari 打开，点底部的分享按钮，再点“添加到主屏幕”");
      card.hidden = false;
    }
    let deferred = null;
    addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault(); deferred = e;
      document.getElementById("install-tip").textContent = tr("install.android", "一键装到桌面，打开更快");
      document.getElementById("install-btn").hidden = false;
      card.hidden = false;
    });
    document.getElementById("install-btn").onclick = async () => {
      if (!deferred) return;
      deferred.prompt(); await deferred.userChoice; deferred = null; card.hidden = true;
    };
    document.getElementById("install-x").onclick = () => {
      card.hidden = true;
      try { localStorage.setItem("pr_install_x", "1"); } catch (e) {}
    };
  })();
</script>
</body>
</html>
