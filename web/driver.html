<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title data-i18n="meta.title.driver">司机 · 私人专车</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#0e0e0e" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="私人专车" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("/web/sw.js").catch(() => {}));</script>
<link rel="stylesheet" href="styles.css?v=20261014a" />
<style>
  /* 熟客便签：卡片底部可折叠编辑区 */
  .note-box { margin-top: 8px; border-top: 1px dashed var(--faint); padding-top: 6px; }
  .note-box summary { cursor: pointer; font-size: 14px; color: var(--text); list-style: none; }
  .note-box summary::-webkit-details-marker { display: none; }
  .note-box summary::before { content: "▸ "; color: var(--gold); }
  .note-box[open] summary::before { content: "▾ "; color: var(--gold); }
  .note-box .note-add { color: var(--blue); }
  .note-box .note-prev { color: var(--muted); }
  .note-box textarea { width: 100%; min-height: 54px; margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <span class="mark">🚙</span>
      <h1><span data-i18n="d.title">司机接单</span><em>DRIVER</em></h1>
    </div>
    <span class="links"><button type="button" class="lang-toggle" id="lang-toggle">EN</button><a href="account.html" data-i18n="nav.account">账号</a><a href="index.html" data-i18n="nav.switch">切换身份</a><a href="#" onclick="logout();return false;" data-i18n="nav.signout">退出</a></span>
  </div>

  <div id="login"></div>

  <div id="invite" style="display:none">
    <div class="card">
      <div class="card_h" data-i18n="d.invite">司机邀请码</div>
      <p class="hint" data-i18n="d.invite_hint">你是乘客身份。输入司机邀请码即可成为司机、查看并接受订单。</p>
      <div class="row">
        <input id="invite-code" data-i18n-ph="d.invite_ph" placeholder="8 位邀请码" style="flex:1;text-transform:uppercase" maxlength="8" />
        <button class="secondary" id="btn-redeem" data-i18n="d.redeem">兑换</button>
      </div>
      <p class="hint" id="invite-msg"></p>
    </div>
  </div>

  <div id="main" style="display:none">
    <div class="card">
      <div class="card_h" data-i18n="d.duty">接单状态</div>
      <div class="row" style="align-items:center">
        <span id="online-label" style="flex:1">🟢 在线接单中</span>
        <button class="small primary" id="btn-toggle-online" data-i18n="d.toggle">切换</button>
      </div>
      <p class="hint" data-i18n="d.duty_hint">休息时切换为离线，新订单不会再推送给你。</p>
    </div>
    <div class="card">
      <div class="card_h" data-i18n="d.earnings">收入统计</div>
      <div class="row" style="gap:8px;margin-bottom:8px">
        <button type="button" class="secondary small earn-days" data-days="7" style="flex:1" data-i18n="d.d7">近 7 天</button>
        <button type="button" class="secondary small earn-days" data-days="30" style="flex:1" data-i18n="d.d30">近 30 天</button>
      </div>
      <div class="meta" id="earn-line">加载中…</div>
    </div>
    <div class="card">
      <div class="card_h" data-i18n="d.vehicle">我的车辆</div>
      <div class="row">
        <div style="flex:2">
          <label class="f" for="v-model" data-i18n="d.v_model">车型</label>
          <input id="v-model" data-i18n-ph="d.v_model_ph" placeholder="例如：Toyota Sienna" maxlength="64" />
        </div>
        <div style="flex:1">
          <label class="f" for="v-seats" data-i18n="d.v_seats">座位数</label>
          <input id="v-seats" type="number" min="1" max="20" value="6" />
        </div>
      </div>
      <label class="f" for="v-plate" data-i18n="d.v_plate">车牌</label>
      <input id="v-plate" data-i18n-ph="d.v_plate_ph" placeholder="例如：8ABC123" maxlength="16" style="text-transform:uppercase" />
      <div class="actions"><button class="small primary" id="btn-save-vehicle" data-i18n="d.save_vehicle">保存车辆信息</button></div>
      <p class="hint" id="vehicle-msg"></p>
      <p class="hint" id="rating-line"></p>
      <p class="hint" id="loc-badge"></p>
    </div>
    <div class="sec"><h3 data-i18n="d.open">待接订单</h3><span class="count" id="open-count"></span></div>
    <div id="open"></div>
    <div class="sec"><h3 data-i18n="d.mine">我的行程</h3><span class="count" id="mine-count"></span></div>
    <div id="mine"></div>
  </div>
</div>
<script src="i18n.js?v=20261014a"></script>
<script src="app.js?v=20261014a"></script>
<script>
  const $ = (id) => document.getElementById(id);

  // 乘客联系方式里提取电话号码，生成可拨打链接
  function contactLinks(contact) {
    const m = contact.match(/\+?[\d][\d\s\-()]{6,}/);
    const safe = esc(contact);
    if (m) {
      const tel = m[0].replace(/[\s\-()]/g, "");
      return `<a href="tel:${tel}">${safe}</a>`;
    }
    return safe;
  }

  function rideCard2(r, actionsHtml = "") {
    const when = r.scheduled_at
      ? new Date(r.scheduled_at).toLocaleString(dateLocale(), { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })
      : t("card.now");
    const stops = (r.stops && r.stops.length)
      ? `<div class="meta">${t("p.stops")}${r.stops.map(esc).join(" → ")}</div>` : "";
    // 去接人：导航到上车点；行程中：导航全程（上车点→经停→下车点）
    const navUrl = ["arrived", "in_progress"].includes(r.status)
      ? "https://www.google.com/maps/dir/?api=1"
        + "&origin=" + encodeURIComponent(r.pickup_text)
        + "&destination=" + encodeURIComponent(r.dropoff_text)
        + ((r.stops && r.stops.length) ? "&waypoints=" + r.stops.map(encodeURIComponent).join("|") : "")
      : "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(r.pickup_text);
    const navLabel = ["arrived", "in_progress"].includes(r.status) ? t("d.nav_trip") : t("d.nav_pickup");
    return `<div class="card">
      <div class="card-head"><span class="${badgeClass(r.status)}">${statusLabel(r.status)}</span>
      <span class="time">${when}</span></div>
      <div class="route"><span class="route-line"></span><span class="pdot from"></span><span>${esc(r.pickup_text)}</span></div>
      <div class="route"><span class="pdot to"></span><span>${esc(r.dropoff_text)}</span></div>
      ${stops}
      <div class="meta"><b>${riders(r.seats_needed)}</b>${r.note ? " · " + esc(r.note) : ""}</div>
      ${r.flight_no ? `<div class="meta">${t("flight.show")}${esc(r.flight_no)}</div>` : ""}
      ${r.booked_for_name ? `<div class="meta">${t("p.booked_for")}${esc(r.booked_for_name)}${r.booked_for_phone ? " · " + esc(r.booked_for_phone) : ""}</div>` : ""}
      <div class="meta">💰 ${esc(priceLabel(r))}</div>
      <div class="meta">💳 ${esc(payLabel(r))}</div>
      ${r.passenger_contact ? `<div class="meta">${t("d.passenger")}${contactLinks(r.passenger_contact)}</div>` : ""}
      <div class="meta">🗺️ <a href="${navUrl}" target="_blank">${navLabel}</a></div>
      ${noteHtml(r)}
      ${actionsHtml}
    </div>`;
  }

  // ---- 熟客便签：可折叠编辑区（显示乘客名+便签，没有就显示"添加便签"） ----
  let _notesByPid = {};
  async function loadNotes() {
    try {
      const list = await api.req("/drivers/notes");
      _notesByPid = {};
      (list || []).forEach((n) => { _notesByPid[n.passenger_id] = n; });
    } catch (e) { _notesByPid = {}; }
  }

  function noteHtml(r) {
    if (!r.passenger_id) return "";
    const pid = r.passenger_id;
    const saved = _notesByPid[pid];
    const has = !!(saved && saved.note);
    const preview = has
      ? `<span class="note-prev">${esc((saved.passenger_name ? saved.passenger_name + "：" : "") +
          (saved.note.length > 26 ? saved.note.slice(0, 26) + "…" : saved.note))}</span>`
      : `<span class="note-add">${t("notes.add")}</span>`;
    return `<details class="note-box">
      <summary><span>${t("notes.title")}</span> ${preview}</summary>
      <div class="note-edit">
        <textarea id="note-${pid}" maxlength="1000" placeholder="${esc(t("notes.ph"))}">${has ? esc(saved.note) : ""}</textarea>
        <div class="actions"><button class="small primary" onclick="saveNote('${pid}')">${t("notes.save")}</button></div>
        <p class="hint">${t("notes.clear_hint")}</p>
        <p class="hint" id="note-msg-${pid}"></p>
      </div>
    </details>`;
  }

  async function saveNote(pid) {
    const ta = document.getElementById("note-" + pid);
    const msg = document.getElementById("note-msg-" + pid);
    if (!ta || !msg) return;
    msg.textContent = t("notes.saving");
    try {
      const res = await api.req(`/drivers/notes/${pid}`, {
        method: "PUT", body: JSON.stringify({ note: ta.value }),
      });
      msg.textContent = res.deleted ? t("notes.deleted") : t("notes.saved");
      await loadNotes();
      setTimeout(refresh, 600);
    } catch (e) { msg.textContent = e.message; }
  }

  // 正在编辑便签时不自动刷新，避免 15 秒轮询吞掉输入中的文字
  function _noteEditing() {
    const el = document.activeElement;
    return (el && el.tagName === "TEXTAREA") || !!document.querySelector(".note-box[open]");
  }

  // ---- 新订单提示音：来新单时叮一声（首次点击页面后解锁音频权限） ----
  let _audioCtx = null;
  const _knownOpen = new Set();
  let _firstOpenLoad = true;
  document.addEventListener("pointerdown", () => {
    if (!_audioCtx) {
      try { _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { /* */ }
    }
    if (_audioCtx && _audioCtx.state === "suspended") _audioCtx.resume();
  });
  function beep() {
    try {
      if (!_audioCtx) return;
      const t = _audioCtx.currentTime;
      const o = _audioCtx.createOscillator();
      const g = _audioCtx.createGain();
      o.connect(g); g.connect(_audioCtx.destination);
      o.frequency.value = 880;
      g.gain.setValueAtTime(0.001, t);
      g.gain.exponentialRampToValueAtTime(0.3, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
      o.start(t); o.stop(t + 0.65);
    } catch (e) { /* */ }
  }

  async function refresh() {
    try {
      await loadNotes();
      const open = await api.openRides();
      $("open-count").textContent = open.length ? t("d.open_count", { n: open.length }) : "";
      $("open").innerHTML = open.length
        ? open.map((r) => rideCard2(r,
            `<div class="actions"><button class="small primary go" onclick="acceptRide('${r.id}')">${t("d.accept")}</button></div>`)).join("")
        : `<div class="empty"><span class="big">☕</span>${t("d.no_open")}<br />${t("d.no_open_sub")}</div>`;
      // 新出现的订单 ID → 提示音（首次加载不响）
      const ids = new Set(open.map((r) => r.id));
      if (!_firstOpenLoad) {
        for (const id of ids) { if (!_knownOpen.has(id)) { beep(); break; } }
      }
      _firstOpenLoad = false;
      _knownOpen.clear();
      ids.forEach((id) => _knownOpen.add(id));
    } catch (e) { $("open").innerHTML = `<p class="hint">${esc(e.message)}</p>`; }

    try {
      const mine = (await api.myRides()).filter((r) => !["completed", "cancelled"].includes(r.status));
      maybeShareLocation(mine.length > 0);
      $("mine-count").textContent = mine.length ? t("d.mine_count", { n: mine.length }) : "";
      $("mine").innerHTML = mine.length
        ? mine.map((r) => {
            const next = nextStatus(r.status);
            // 包车单点"完成行程"时先让司机填实际小时数，走 finish-hourly 结算
            const isHourlyFinish = r.price_mode === "hourly" && next && next[0] === "completed";
            const btns = next
              ? `<button class="small primary" onclick="${isHourlyFinish ? `advanceHourly('${r.id}')` : `advanceRide('${r.id}','${next[0]}')`}">${next[1]}</button>` : "";
            const cancel = ["requested", "accepted", "en_route", "arrived"].includes(r.status)
              ? `<button class="small danger" onclick="cancelRide('${r.id}')">${t("d.cancel")}</button>` : "";
            let quoteHtml = "";
            if (r.price_mode === "quote" && ["accepted", "en_route", "arrived"].includes(r.status)
                && (r.price_status !== "pending" || r.price_quote_cents == null)) {
              quoteHtml = `<div class="actions" style="margin-top:8px">
                <input id="quote-${r.id}" type="number" min="0" step="0.5" placeholder="${t("d.quote_ph")}" style="width:110px" />
                <button class="small primary" onclick="quoteRide('${r.id}')">${t("d.quote")}</button>
              </div>`;
            } else if (r.price_mode === "quote" && r.price_status === "pending" && r.price_quote_cents != null) {
              quoteHtml = `<div class="meta">${t("d.quoted_wait", { p: fmtPrice(r.price_quote_cents) })}</div>`;
            }
            return rideCard2(r, `<div class="actions">${btns}${cancel}</div>${quoteHtml}`);
          }).join("")
        : `<div class="empty"><span class="big">🛣️</span>${t("d.no_mine")}</div>`;
    } catch (e) { $("mine").innerHTML = `<p class="hint">${esc(e.message)}</p>`; }
  }

  async function quoteRide(id) {
    const inp = $("quote-" + id);
    const dollars = parseFloat(inp.value);
    if (!(dollars > 0)) { alert(t("d.need_quote")); return; }
    try { await api.quoteRide(id, Math.round(dollars * 100)); refresh(); }
    catch (e) { alert(e.message); }
  }

  async function acceptRide(id) {
    try { await api.acceptRide(id); refresh(); }
    catch (e) { alert(e.message); }
  }
  async function advanceRide(id, status) {
    try { await api.setStatus(id, status); refresh(); }
    catch (e) { alert(e.message); }
  }
  // 包车结算：先弹框让司机填实际小时数，再调 finish-hourly
  async function advanceHourly(id) {
    const raw = prompt(t("d.hourly_hours"));
    if (raw == null) return; // 用户点了取消
    const hours = parseFloat(raw);
    if (!(hours >= 0.5 && hours <= 24)) { alert(t("d.hourly_hours_bad")); return; }
    try { await api.finishHourly(id, hours); refresh(); }
    catch (e) { alert(e.message); }
  }
  async function cancelRide(id) {
    if (!confirm(t("d.confirm_cancel"))) return;
    try { await api.cancelRide(id); refresh(); }
    catch (e) { alert(e.message); }
  }

  $("btn-redeem").onclick = async () => {
    const code = $("invite-code").value.trim();
    const msg = $("invite-msg");
    if (!code) { msg.textContent = t("d.need_code"); return; }
    try {
      await api.req("/invites/redeem", {
        method: "POST", body: JSON.stringify({ code }),
      });
      msg.textContent = t("d.became_driver");
      setTimeout(() => location.reload(), 800);
    } catch (e) { msg.textContent = e.message; }
  };

  async function checkRoleAndShow() {
    try {
      const me = await api.me();
      if (me.role === "driver" || me.role === "admin") {
        $("invite").style.display = "none";
        $("main").style.display = "";
        loadVehicle();
        loadOnline();
        loadEarnings(7);
        refresh();
      } else {
        $("main").style.display = "none";
        $("invite").style.display = "";
      }
    } catch (e) {
      $("invite").style.display = "none";
    }
  }

  // ---- 在线/离线 ----
  async function loadOnline() {
    try {
      const r = await api.req("/me/online");
      setOnlineLabel(r.online);
    } catch (e) { /* */ }
  }
  function setOnlineLabel(online) {
    $("online-label").textContent = online ? t("d.online") : t("d.offline");
  }
  $("btn-toggle-online").onclick = async () => {
    const nowOnline = $("online-label").textContent.includes("在线");
    try {
      const r = await api.req("/me/online", {
        method: "POST", body: JSON.stringify({ online: !nowOnline }),
      });
      setOnlineLabel(r.online);
    } catch (e) { alert(e.message); }
  };

  // ---- 收入统计 ----
  let earnDays = 7;
  document.querySelectorAll(".earn-days").forEach((b) => {
    b.onclick = () => {
      earnDays = parseInt(b.dataset.days);
      document.querySelectorAll(".earn-days").forEach((x) =>
        x.classList.toggle("primary", x === b));
      loadEarnings(earnDays);
    };
  });
  document.querySelector('.earn-days[data-days="7"]').classList.add("primary");
  async function loadEarnings(days) {
    const el = $("earn-line");
    el.textContent = t("d.loading");
    try {
      const r = await api.req(`/me/earnings?days=${days}`);
      el.textContent = t("d.earn_line", {
        c: r.completed_count,
        f: "$" + (r.fare_cents / 100).toFixed(2),
        tp: "$" + (r.tip_cents / 100).toFixed(2),
        tt: "$" + (r.total_cents / 100).toFixed(2),
        r: r.avg_rating ? ` · ⭐${r.avg_rating}` : "",
      });
    } catch (e) { el.textContent = e.message; }
  }

  async function loadVehicle() {
    try {
      const p = await api.getDriverProfile();
      $("v-model").value = p.vehicle_model || "";
      $("v-plate").value = p.plate || "";
      $("v-seats").value = p.seats || 6;
      const tagSep = prLang() === "en" ? ", " : "、";
      $("rating-line").textContent = p.rating_count > 0
        ? t("d.rating_line", {
            a: p.avg_rating, c: p.rating_count,
            tags: (p.top_tags || []).length ? t("d.rating_tags", { t: p.top_tags.join(tagSep) }) : "",
          })
        : "";
    } catch (e) { /* 没填过就空着 */ }
  }

  $("btn-save-vehicle").onclick = async () => {
    const msg = $("vehicle-msg");
    const data = {
      vehicle_model: $("v-model").value.trim(),
      plate: $("v-plate").value.trim(),
      seats: parseInt($("v-seats").value) || 6,
    };
    if (!data.vehicle_model && !data.plate) { msg.textContent = t("d.need_vehicle"); return; }
    msg.textContent = t("d.saving");
    try {
      await api.saveDriverProfile(data);
      msg.textContent = t("d.saved");
    } catch (e) { msg.textContent = e.message; }
  };

  // ---- 实时位置共享：有进行中订单时自动上报 GPS ----
  let locWatchId = null, lastLocSent = 0;
  async function sendLocation(lat, lng) {
    const now = Date.now();
    if (now - lastLocSent < 15000) return; // 15 秒节流
    lastLocSent = now;
    try {
      await api.req("/me/location", {
        method: "POST", body: JSON.stringify({ lat, lng }),
      });
    } catch (e) { /* 静默：下次再试 */ }
  }
  function maybeShareLocation(hasActiveRide) {
    const badge = $("loc-badge");
    if (hasActiveRide && "geolocation" in navigator && locWatchId === null) {
      locWatchId = navigator.geolocation.watchPosition(
        (pos) => sendLocation(pos.coords.latitude, pos.coords.longitude),
        () => { if (badge) badge.textContent = t("d.loc_denied"); },
        { enableHighAccuracy: true, maximumAge: 10000 }
      );
      if (badge) badge.textContent = t("d.loc_sharing");
    } else if (!hasActiveRide && locWatchId !== null) {
      navigator.geolocation.clearWatch(locWatchId);
      locWatchId = null;
      if (badge) badge.textContent = "";
    }
  }

  ensureSession($("login"), $("main"), () => checkRoleAndShow());
  setInterval(() => { if ($("main").style.display !== "none" && !_noteEditing()) refresh(); }, 15000);
  // 语言切换时重渲染动态内容
  window.addEventListener("pr:langchange", () => {
    if ($("main").style.display !== "none") {
      refresh(); loadEarnings(earnDays); loadOnline();
      if ($("invite").style.display === "none") loadVehicle();
    }
  });
</script>
</body>
</html>
