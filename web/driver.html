<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>司机 · 私人专车</title>
<link rel="stylesheet" href="styles.css?v=20261006a" />
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <span class="mark">🚙</span>
      <h1>司机接单<em>DRIVER</em></h1>
    </div>
    <span class="links"><a href="index.html">切换身份</a><a href="#" onclick="logout();return false;">退出</a></span>
  </div>

  <div id="login"></div>

  <div id="invite" style="display:none">
    <div class="card">
      <div class="card_h">司机邀请码</div>
      <p class="hint">你是乘客身份。输入司机邀请码即可成为司机、查看并接受订单。</p>
      <div class="row">
        <input id="invite-code" placeholder="8 位邀请码" style="flex:1;text-transform:uppercase" maxlength="8" />
        <button class="secondary" id="btn-redeem">兑换</button>
      </div>
      <p class="hint" id="invite-msg"></p>
    </div>
  </div>

  <div id="main" style="display:none">
    <div class="card">
      <div class="card_h">我的车辆</div>
      <div class="row">
        <div style="flex:2">
          <label class="f" for="v-model">车型</label>
          <input id="v-model" placeholder="例如：Toyota Sienna" maxlength="64" />
        </div>
        <div style="flex:1">
          <label class="f" for="v-seats">座位数</label>
          <input id="v-seats" type="number" min="1" max="20" value="6" />
        </div>
      </div>
      <label class="f" for="v-plate">车牌</label>
      <input id="v-plate" placeholder="例如：8ABC123" maxlength="16" style="text-transform:uppercase" />
      <div class="actions"><button class="small primary" id="btn-save-vehicle">保存车辆信息</button></div>
      <p class="hint" id="vehicle-msg"></p>
    </div>
    <div class="sec"><h3>待接订单</h3><span class="count" id="open-count"></span></div>
    <div id="open"></div>
    <div class="sec"><h3>我的行程</h3><span class="count" id="mine-count"></span></div>
    <div id="mine"></div>
  </div>
</div>
<script src="app.js?v=20261006a"></script>
<script>
  const $ = (id) => document.getElementById(id);

  // 乘客联系方式里提取电话号码，生成可拨打链接
  function contactLinks(contact) {
    const m = contact.match(/\+?[\d][\d\s\-()]{6,}/);
    const safe = esc(contact);
    if (m) {
      const tel = m[0].replace(/[\s\-()]/g, "");
      return `<a href="tel:${tel}">${safe}</a>`;
    }
    return safe;
  }

  function rideCard2(r, actionsHtml = "") {
    const when = r.scheduled_at
      ? new Date(r.scheduled_at).toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })
      : "现在用车";
    return `<div class="card">
      <div class="card-head"><span class="${badgeClass(r.status)}">${STATUS_LABEL[r.status] || r.status}</span>
      <span class="time">${when}</span></div>
      <div class="route"><span class="route-line"></span><span class="pdot from"></span><span>${esc(r.pickup_text)}</span></div>
      <div class="route"><span class="pdot to"></span><span>${esc(r.dropoff_text)}</span></div>
      <div class="meta"><b>${r.seats_needed}</b> 人${r.note ? " · " + esc(r.note) : ""}</div>
      <div class="meta">💰 ${esc(priceLabel(r))}</div>
      <div class="meta">💳 ${esc(payLabel(r))}</div>
      ${r.passenger_contact ? `<div class="meta">📞 乘客：${contactLinks(r.passenger_contact)}</div>` : ""}
      <div class="meta">🗺️ <a href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(r.pickup_text)}" target="_blank">导航到上车点</a></div>
      ${actionsHtml}
    </div>`;
  }

  async function refresh() {
    try {
      const open = await api.openRides();
      $("open-count").textContent = open.length ? `${open.length} 单待接` : "";
      $("open").innerHTML = open.length
        ? open.map((r) => rideCard2(r,
            `<div class="actions"><button class="small primary go" onclick="acceptRide('${r.id}')">接单</button></div>`)).join("")
        : '<div class="empty"><span class="big">☕</span>暂无待接订单<br />有新订单会实时出现在这里</div>';
    } catch (e) { $("open").innerHTML = `<p class="hint">${esc(e.message)}</p>`; }

    try {
      const mine = (await api.myRides()).filter((r) => !["completed", "cancelled"].includes(r.status));
      $("mine-count").textContent = mine.length ? `${mine.length} 单进行中` : "";
      $("mine").innerHTML = mine.length
        ? mine.map((r) => {
            const next = NEXT_STATUS[r.status];
            const btns = next
              ? `<button class="small primary" onclick="advanceRide('${r.id}','${next[0]}')">${next[1]}</button>` : "";
            const cancel = ["requested", "accepted", "en_route", "arrived"].includes(r.status)
              ? `<button class="small danger" onclick="cancelRide('${r.id}')">取消</button>` : "";
            let quoteHtml = "";
            if (r.price_mode === "quote" && ["accepted", "en_route"].includes(r.status)
                && (r.price_status !== "pending" || r.price_quote_cents == null)) {
              quoteHtml = `<div class="actions" style="margin-top:8px">
                <input id="quote-${r.id}" type="number" min="0" step="0.5" placeholder="报价 $" style="width:110px" />
                <button class="small primary" onclick="quoteRide('${r.id}')">报价</button>
              </div>`;
            } else if (r.price_mode === "quote" && r.price_status === "pending" && r.price_quote_cents != null) {
              quoteHtml = `<div class="meta">⏳ 已报价 ${fmtPrice(r.price_quote_cents)}，等乘客确认</div>`;
            }
            return rideCard2(r, `<div class="actions">${btns}${cancel}</div>${quoteHtml}`);
          }).join("")
        : '<div class="empty"><span class="big">🛣️</span>暂无进行中的行程</div>';
    } catch (e) { $("mine").innerHTML = `<p class="hint">${esc(e.message)}</p>`; }
  }

  async function quoteRide(id) {
    const inp = $("quote-" + id);
    const dollars = parseFloat(inp.value);
    if (!(dollars > 0)) { alert("请填写报价"); return; }
    try { await api.quoteRide(id, Math.round(dollars * 100)); refresh(); }
    catch (e) { alert(e.message); }
  }

  async function acceptRide(id) {
    try { await api.acceptRide(id); refresh(); }
    catch (e) { alert(e.message); }
  }
  async function advanceRide(id, status) {
    try { await api.setStatus(id, status); refresh(); }
    catch (e) { alert(e.message); }
  }
  async function cancelRide(id) {
    if (!confirm("确定取消这单吗？")) return;
    try { await api.cancelRide(id); refresh(); }
    catch (e) { alert(e.message); }
  }

  $("btn-redeem").onclick = async () => {
    const code = $("invite-code").value.trim();
    const msg = $("invite-msg");
    if (!code) { msg.textContent = "请输入邀请码"; return; }
    try {
      await api.req("/invites/redeem", {
        method: "POST", body: JSON.stringify({ code }),
      });
      msg.textContent = "✓ 已成为司机";
      setTimeout(() => location.reload(), 800);
    } catch (e) { msg.textContent = e.message; }
  };

  async function checkRoleAndShow() {
    try {
      const me = await api.me();
      if (me.role === "driver" || me.role === "admin") {
        $("invite").style.display = "none";
        $("main").style.display = "";
        loadVehicle();
        refresh();
      } else {
        $("main").style.display = "none";
        $("invite").style.display = "";
      }
    } catch (e) {
      $("invite").style.display = "none";
    }
  }

  async function loadVehicle() {
    try {
      const p = await api.getDriverProfile();
      $("v-model").value = p.vehicle_model || "";
      $("v-plate").value = p.plate || "";
      $("v-seats").value = p.seats || 6;
    } catch (e) { /* 没填过就空着 */ }
  }

  $("btn-save-vehicle").onclick = async () => {
    const msg = $("vehicle-msg");
    const data = {
      vehicle_model: $("v-model").value.trim(),
      plate: $("v-plate").value.trim(),
      seats: parseInt($("v-seats").value) || 6,
    };
    if (!data.vehicle_model && !data.plate) { msg.textContent = "请至少填写车型或车牌"; return; }
    msg.textContent = "保存中…";
    try {
      await api.saveDriverProfile(data);
      msg.textContent = "✓ 已保存，乘客在进行中的订单里能看到你的车";
    } catch (e) { msg.textContent = e.message; }
  };

  ensureSession($("login"), $("main"), () => checkRoleAndShow());
  setInterval(() => { if ($("main").style.display !== "none") refresh(); }, 15000);
</script>
</body>
</html>
