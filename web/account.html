<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title data-i18n="acct.title">账号设置 · 私人专车</title>
<link rel="stylesheet" href="styles.css?v=20261014a" />
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <span class="mark">👤</span>
      <h1><span data-i18n="acct.title">账号设置</span><em>ACCOUNT</em></h1>
    </div>
    <span class="links"><button type="button" class="lang-toggle" id="lang-toggle">EN</button><a href="index.html" data-i18n="nav.home">首页</a></span>
  </div>

  <div id="login"></div>

  <div id="main" style="display:none">
    <div class="card">
      <div class="card_h" data-i18n="acct.profile">我的资料</div>
      <div class="meta" id="acct-ident"></div>
      <label class="f" for="acct-name" data-i18n="acct.name">昵称</label>
      <input id="acct-name" data-i18n-ph="acct.name_ph" placeholder="输入昵称" maxlength="64" />
      <button type="button" id="btn-save" data-i18n="acct.save">保存</button>
      <p class="hint" id="acct-msg" aria-live="polite"></p>
    </div>

    <div class="card">
      <div class="card_h" data-i18n="acct.language">语言</div>
      <div class="row" style="gap:8px">
        <button type="button" class="secondary small" id="btn-lang-zh" style="flex:1">中文</button>
        <button type="button" class="secondary small" id="btn-lang-en" style="flex:1">English</button>
      </div>
    </div>

    <div class="card">
      <div class="card_h" data-i18n="acct.danger">危险操作</div>
      <button type="button" class="secondary" id="btn-signout" data-i18n="acct.signout">退出登录</button>
      <p class="hint" data-i18n="acct.delete_warn" style="margin-top:12px">注销后账号、常用地址、分享链接将被删除，订单记录会匿名保留。不可恢复。</p>
      <button type="button" class="danger" id="btn-delete" data-i18n="acct.delete">注销账号</button>
    </div>
  </div>
</div>
<script src="i18n.js?v=20261014b"></script>
<script src="app.js?v=20261014a"></script>
<script>
(function () {
  var msg = function (t) { document.getElementById("acct-msg").textContent = t; };
  var currentUser = null;

  function roleLabel(role) {
    return t("acct.role." + role) || role;
  }

  function renderUser(u) {
    currentUser = u;
    var ident = [];
    if (u.phone) ident.push(t("acct.phone") + ": " + esc(u.phone));
    if (u.email) ident.push(t("acct.email") + ": " + esc(u.email));
    ident.push(t("acct.role") + ": " + esc(roleLabel(u.role)));
    document.getElementById("acct-ident").innerHTML = ident.join("<br>");
    document.getElementById("acct-name").value = u.name || "";
    markLangButtons();
  }

  function markLangButtons() {
    var l = (window.I18N && I18N.prLang()) || "zh";
    document.getElementById("btn-lang-zh").classList.toggle("active", l === "zh");
    document.getElementById("btn-lang-en").classList.toggle("active", l === "en");
  }

  document.getElementById("btn-save").onclick = async function () {
    var name = document.getElementById("acct-name").value.trim();
    try {
      var u = await api.req("/me", { method: "PATCH", body: JSON.stringify({ name: name }) });
      renderUser(u);
      msg(t("acct.saved"));
    } catch (e) { msg(e.message); }
  };

  async function setLangAndSync(l) {
    if (window.I18N) I18N.setLang(l);
    markLangButtons();
    renderUser(currentUser || {});
    // 同步到服务端，推送/邮件用这个语言
    try { await api.req("/me", { method: "PATCH", body: JSON.stringify({ lang: l }) }); }
    catch (e) { /* 本地已切换，服务端同步失败不打扰 */ }
  }
  document.getElementById("btn-lang-zh").onclick = function () { setLangAndSync("zh"); };
  document.getElementById("btn-lang-en").onclick = function () { setLangAndSync("en"); };

  document.getElementById("btn-signout").onclick = async function () {
    try { await api.req("/auth/logout", { method: "POST" }); } catch (e) { /* 忽略 */ }
    localStorage.removeItem("pr_token");
    msg(t("acct.signout_done"));
    setTimeout(function () { location.href = "index.html"; }, 800);
  };

  document.getElementById("btn-delete").onclick = async function () {
    if (!confirm(t("acct.delete_confirm1"))) return;
    if (!confirm(t("acct.delete_confirm2"))) return;
    try {
      await api.req("/me?confirm=true", { method: "DELETE" });
      localStorage.removeItem("pr_token");
      msg(t("acct.deleted"));
      setTimeout(function () { location.href = "index.html"; }, 1200);
    } catch (e) { msg(e.message); }
  };

  // 语言切换时重渲染
  window.addEventListener("pr:langchange", function () {
    if (currentUser) renderUser(currentUser);
    markLangButtons();
  });

  ensureSession(
    document.getElementById("login"),
    document.getElementById("main"),
    function (user) { renderUser(user); }
  );
})();
</script>
</body>
</html>
