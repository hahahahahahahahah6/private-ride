<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>乘客 · 私人专车</title>
<link rel="stylesheet" href="styles.css?v=20261006b" />
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <span class="mark">🧍</span>
      <h1>乘客约车<em>PASSENGER</em></h1>
    </div>
    <span class="links"><a href="index.html">切换身份</a><a href="#" onclick="logout();return false;">退出</a></span>
  </div>

  <div id="login"></div>

  <div id="main" style="display:none">
    <div class="card">
      <div class="card_h">叫车</div>
      <label class="f" for="pickup">上车地点</label>
      <input id="pickup" placeholder="例如：家里小区门口" />
      <label class="f" for="dropoff">下车地点</label>
      <input id="dropoff" placeholder="例如：罗兰岗大华超市" />
      <div class="row">
        <div style="flex:1">
          <label class="f" for="seats">人数</label>
          <input id="seats" type="number" min="1" max="20" value="1" />
        </div>
        <div style="flex:2">
          <label class="f" for="when">用车时间</label>
          <input id="when" type="datetime-local" />
        </div>
      </div>
      <label class="f" for="note">备注（可选）</label>
      <input id="note" placeholder="如：有大件行李、带小孩" />
      <label class="f">价格方式</label>
      <div class="row" style="gap:8px;margin-bottom:10px">
        <button type="button" class="secondary small price-mode" data-mode="offer" style="flex:1">我出价</button>
        <button type="button" class="secondary small price-mode" data-mode="mileage" style="flex:1">里程计价</button>
        <button type="button" class="secondary small price-mode" data-mode="quote" style="flex:1">司机报价</button>
      </div>
      <div id="price-offer-wrap">
        <label class="f" for="price-offer">你的出价（美元）</label>
        <input id="price-offer" type="number" min="0" step="0.5" placeholder="如：25" />
      </div>
      <div id="price-mileage-wrap" style="display:none">
        <label class="f" for="price-miles">预估里程（英里）</label>
        <input id="price-miles" type="number" min="0" step="0.5" placeholder="如：10" />
        <p class="hint" id="mileage-hint">起步 $8 + $3/英里</p>
      </div>
      <div id="price-quote-wrap" style="display:none">
        <p class="hint">司机接单后会报价，你再确认。</p>
      </div>
      <label class="f">付款方式</label>
      <div class="row" style="gap:8px;margin-bottom:10px">
        <button type="button" class="secondary small pay-mode" data-mode="offline" style="flex:1">线下当面付</button>
        <button type="button" class="secondary small pay-mode" data-mode="online" style="flex:1">线上付款</button>
      </div>
      <div id="card-wrap" style="display:none">
        <div id="card-info" class="hint"></div>
        <div id="card-form" style="display:none">
          <div id="card-element" style="padding:12px;background:var(--card);border-radius:12px;margin-bottom:8px"></div>
          <button type="button" class="secondary small" id="btn-bind-card">绑定这张卡</button>
          <p class="hint" id="bind-msg"></p>
        </div>
      </div>
      <button class="primary pulse" id="btn-book">叫车</button>
      <p class="hint" id="book-msg"></p>
    </div>

    <div class="sec"><h3>我的订单</h3><span class="count" id="rides-count"></span></div>
    <div id="rides"></div>
  </div>
</div>
<script src="app.js?v=20261006b"></script>
<script src="https://js.stripe.com/v3/"></script>
<script>
  const $ = (id) => document.getElementById(id);

  // ---- 付款方式 ----
  let payMode = "offline";
  let stripe = null, cardEl = null, stripePk = "";
  document.querySelectorAll(".pay-mode").forEach((b) => {
    b.onclick = async () => {
      payMode = b.dataset.mode;
      document.querySelectorAll(".pay-mode").forEach((x) =>
        x.classList.toggle("primary", x === b));
      $("card-wrap").style.display = payMode === "online" ? "" : "none";
      if (payMode === "online") await initCard();
    };
  });
  document.querySelector('.pay-mode[data-mode="offline"]').classList.add("primary");

  async function initCard() {
    try {
      const cfg = await api.req("/pay/config");
      stripePk = cfg.publishable_key;
      if (!cfg.configured || !stripePk) {
        $("card-info").textContent = "线上付款暂未开通，请选择线下当面付";
        return;
      }
      const me = await api.me();
      if (me.card_last4) {
        $("card-info").textContent = `已绑卡：${me.card_brand || ""} ****${me.card_last4}`;
        $("card-form").style.display = "none";
      } else {
        $("card-info").textContent = "还未绑卡，请添加一张卡用于线上付款";
        $("card-form").style.display = "";
        if (!stripe) {
          stripe = Stripe(stripePk);
          const elements = stripe.elements();
          cardEl = elements.create("card", { style: { base: { color: "#fff", fontSize: "16px" } } });
          cardEl.mount("#card-element");
        }
      }
    } catch (e) { $("card-info").textContent = e.message; }
  }

  $("btn-bind-card").onclick = async () => {
    const msg = $("bind-msg");
    msg.textContent = "绑定中…";
    try {
      const { client_secret } = await api.req("/pay/setup-intent", { method: "POST" });
      const { setupIntent, error } = await stripe.confirmCardSetup(client_secret, {
        payment_method: { card: cardEl },
      });
      if (error) throw new Error(error.message);
      const r = await api.req("/pay/attach", {
        method: "POST",
        body: JSON.stringify({ payment_method_id: setupIntent.payment_method }),
      });
      msg.textContent = `✓ 已绑定 ${r.brand} ****${r.last4}`;
      $("card-form").style.display = "none";
      $("card-info").textContent = `已绑卡：${r.brand} ****${r.last4}`;
    } catch (e) { msg.textContent = e.message; }
  };

  // 价格方式切换
  let priceMode = "offer";
  document.querySelectorAll(".price-mode").forEach((b) => {
    b.onclick = () => {
      priceMode = b.dataset.mode;
      document.querySelectorAll(".price-mode").forEach((x) =>
        x.classList.toggle("primary", x === b));
      $("price-offer-wrap").style.display = priceMode === "offer" ? "" : "none";
      $("price-mileage-wrap").style.display = priceMode === "mileage" ? "" : "none";
      $("price-quote-wrap").style.display = priceMode === "quote" ? "" : "none";
    };
  });
  document.querySelector('.price-mode[data-mode="offer"]').classList.add("primary");
  $("price-miles").oninput = () => {
    const m = parseFloat($("price-miles").value);
    $("mileage-hint").textContent = m > 0
      ? `预估 $${(8 + 3 * m).toFixed(2)}（起步 $8 + $3/英里）`
      : "起步 $8 + $3/英里";
  };

  async function confirmQuoteUI(id, cents) {
    if (!confirm(`司机报价 $${(cents / 100).toFixed(2)}，接受吗？`)) return;
    try { await api.confirmQuote(id, true); refresh(); }
    catch (e) { alert(e.message); }
  }
  async function rejectQuoteUI(id) {
    if (!confirm("拒绝报价？订单会回到待接单，司机可重新报价。")) return;
    try { await api.confirmQuote(id, false); refresh(); }
    catch (e) { alert(e.message); }
  }

  function rideCard2(r, actionsHtml = "") {
    const when = r.scheduled_at
      ? new Date(r.scheduled_at).toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })
      : "现在用车";
    let quoteHtml = "";
    if (r.price_mode === "quote" && r.price_status === "pending" && r.price_quote_cents != null) {
      quoteHtml = `<div class="actions">
        <button class="small primary" onclick="confirmQuoteUI('${r.id}', ${r.price_quote_cents})">接受 $${(r.price_quote_cents / 100).toFixed(2)}</button>
        <button class="small secondary" onclick="rejectQuoteUI('${r.id}')">拒绝</button>
      </div>`;
    }
    return `<div class="card">
      <div class="card-head"><span class="${badgeClass(r.status)}">${STATUS_LABEL[r.status] || r.status}</span>
      <span class="time">${when}</span></div>
      <div class="route"><span class="route-line"></span><span class="pdot from"></span><span>${esc(r.pickup_text)}</span></div>
      <div class="route"><span class="pdot to"></span><span>${esc(r.dropoff_text)}</span></div>
      <div class="meta"><b>${r.seats_needed}</b> 人${r.note ? " · " + esc(r.note) : ""}</div>
      <div class="meta">💰 ${esc(priceLabel(r))}</div>
      <div class="meta">💳 ${esc(payLabel(r))}</div>
      ${r.driver_vehicle && (r.driver_vehicle.vehicle_model || r.driver_vehicle.plate)
        ? `<div class="meta">🚙 车辆：${esc(r.driver_vehicle.vehicle_model)}${r.driver_vehicle.plate ? " · " + esc(r.driver_vehicle.plate) : ""}</div>` : ""}
      ${["accepted", "en_route", "arrived", "in_progress"].includes(r.status) && r.driver_id
        ? `<div class="meta" id="drvloc-${r.id}">📍 司机位置加载中…</div>` : ""}
      ${actionsHtml}
      ${quoteHtml}
    </div>`;
  }

  async function refreshDriverLoc(id, pickupText) {
    const el = $("drvloc-" + id);
    if (!el) return;
    try {
      const loc = await api.req(`/rides/${id}/driver-location`);
      if (!loc) { el.textContent = "📍 司机暂未共享位置"; return; }
      const mins = Math.round((Date.now() - new Date(loc.updated_at).getTime()) / 60000);
      const when = mins <= 0 ? "刚刚" : `${mins} 分钟前`;
      const mapsUrl = `https://www.google.com/maps/dir/?api=1&origin=${loc.lat},${loc.lng}&destination=${encodeURIComponent(pickupText)}`;
      el.innerHTML = `📍 司机位置（${when}更新）· <a href="${mapsUrl}" target="_blank">看路线和预计到达时间</a>`;
    } catch (e) { el.textContent = ""; }
  }

  async function refresh() {
    try {
      const rides = await api.myRides();
      $("rides-count").textContent = rides.length ? `共 ${rides.length} 单` : "";
      $("rides").innerHTML = rides.length
        ? rides.map((r) => {
            const canCancel = ["requested", "accepted", "en_route", "arrived"].includes(r.status);
            const actions = canCancel
              ? `<div class="actions"><button class="small danger" onclick="cancelRide('${r.id}')">取消订单</button></div>` : "";
            return rideCard2(r, actions);
          }).join("")
        : '<div class="empty"><span class="big">🚗</span>还没有订单<br />在上面填好地点，一键叫车</div>';
      rides.forEach((r) => {
        if (["accepted", "en_route", "arrived", "in_progress"].includes(r.status) && r.driver_id) {
          refreshDriverLoc(r.id, r.pickup_text);
        }
      });
    } catch (e) { $("rides").innerHTML = `<p class="hint">${esc(e.message)}</p>`; }
  }

  async function cancelRide(id) {
    if (!confirm("确定取消这单吗？")) return;
    try { await api.cancelRide(id); refresh(); }
    catch (e) { alert(e.message); }
  }

  $("btn-book").onclick = async () => {
    const msg = $("book-msg");
    const pickup_text = $("pickup").value.trim();
    const dropoff_text = $("dropoff").value.trim();
    if (!pickup_text || !dropoff_text) { msg.classList.remove("ok"); msg.textContent = "请填写上车和下车地点"; return; }
    const when = $("when").value;
    const data = {
      pickup_text, dropoff_text,
      seats_needed: parseInt($("seats").value) || 1,
      note: $("note").value.trim(),
      scheduled_at: when ? new Date(when).toISOString() : null,
      price_mode: priceMode,
      pay_mode: payMode,
    };
    if (priceMode === "offer") {
      const dollars = parseFloat($("price-offer").value);
      if (!(dollars > 0)) { msg.classList.remove("ok"); msg.textContent = "请填写你的出价"; return; }
      data.price_offer_cents = Math.round(dollars * 100);
    } else if (priceMode === "mileage") {
      const miles = parseFloat($("price-miles").value);
      if (!(miles > 0)) { msg.classList.remove("ok"); msg.textContent = "请填写预估里程"; return; }
      data.price_miles = miles;
    }
    try {
      await api.createRide(data);
      msg.classList.add("ok");
      msg.textContent = "✓ 下单成功，等待司机接单";
      $("pickup").value = $("dropoff").value = $("note").value = "";
      $("price-offer").value = ""; $("price-miles").value = "";
      refresh();
    } catch (e) { msg.classList.remove("ok"); msg.textContent = e.message; }
  };

  ensureSession($("login"), $("main"), () => refresh());
  setInterval(() => { if ($("main").style.display !== "none") refresh(); }, 15000);
</script>
</body>
</html>
