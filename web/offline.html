<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0e0e0e" />
<title>没有网络 · 私人专车</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e0e0e; color: #f5f1e8;
         font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; text-align: center; padding: 24px; }
  .badge { font-size: 48px; }
  p { color: #a39e93; line-height: 1.6; }
  button { margin-top: 16px; background: #f2ca50; color: #3c2f00; border: 0; border-radius: 12px; padding: 12px 28px; font-size: 16px; font-weight: 600; }
</style>
</head>
<body>
  <div>
    <div class="badge">📶</div>
    <h2>现在没有网络</h2>
    <p>连上网之后再试一次。<br />No connection right now. Please try again once you're online.</p>
    <button onclick="location.reload()">重试 Retry</button>
  </div>
</body>
</html>
