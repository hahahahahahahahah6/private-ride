<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title data-i18n="meta.title.track">行程分享 · 私人专车</title>
<link rel="stylesheet" href="styles.css?v=20261014a" />
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <span class="mark">🔗</span>
      <h1><span data-i18n="tr.title">行程分享</span><em>SHARED RIDE</em></h1>
    </div>
    <span class="links"><button type="button" class="lang-toggle" id="lang-toggle">EN</button></span>
  </div>
  <div id="content"><div class="card"><p class="hint" data-i18n="tr.loading">加载中…</p></div></div>
  <p class="hint" style="text-align:center" data-i18n="tr.note">此链接由乘客分享，仅显示行程状态和司机位置，不含乘客隐私信息。</p>
</div>
<script src="i18n.js?v=20261014a"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const token = new URLSearchParams(location.search).get("t");

  async function load() {
    const box = $("content");
    if (!token) {
      box.innerHTML = `<div class="card"><p class="hint">${t("tr.bad_link")}</p></div>`;
      return;
    }
    try {
      const r = await (await fetch(`/share/${encodeURIComponent(token)}`)).json();
      if (r.detail) throw new Error(r.detail);
      const when = r.scheduled_at
        ? new Date(r.scheduled_at).toLocaleString(dateLocale(), { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })
        : t("card.now");
      const stops = (r.stops && r.stops.length)
        ? `<div class="meta">${t("p.stops")}${r.stops.map(esc).join(" → ")}</div>` : "";
      let locHtml = "";
      if (r.driver_lat != null && r.driver_lng != null) {
        const mins = Math.round((Date.now() - new Date(r.location_updated_at).getTime()) / 60000);
        const mapsUrl = `https://www.google.com/maps/dir/?api=1&origin=${r.driver_lat},${r.driver_lng}&destination=${encodeURIComponent(r.pickup_text)}`;
        const w = mins <= 0 ? t("p.just_now") : t("p.min_ago", { m: mins });
        locHtml = `<div class="meta">${t("tr.driver_loc", { w, u: mapsUrl })}</div>`;
      }
      box.innerHTML = `<div class="card">
        <div class="card-head"><span>${esc(statusLabel(r.status))}</span>
        <span class="time">${when}</span></div>
        <div class="route"><span class="pdot from"></span><span>${esc(r.pickup_text)}</span></div>
        <div class="route"><span class="pdot to"></span><span>${esc(r.dropoff_text)}</span></div>
        ${stops}
        ${(r.vehicle_model || r.plate) ? `<div class="meta">🚙 ${esc(r.vehicle_model)}${r.plate ? " · " + esc(r.plate) : ""}</div>` : ""}
        ${locHtml}
      </div>`;
    } catch (e) {
      box.innerHTML = `<div class="card"><p class="hint">${esc(e.message || t("tr.fail"))}</p></div>`;
    }
  }

  load();
  setInterval(load, 20000);
  window.addEventListener("pr:langchange", load);
</script>
</body>
</html>
